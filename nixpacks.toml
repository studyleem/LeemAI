[phases.setup]
nixPkgs = ["python311", "gcc", "postgresql"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu",
  ". /opt/venv/bin/activate && pip install fastapi==0.115.0 uvicorn==0.30.6 python-multipart==0.0.9 transformers==4.41.2 sentencepiece==0.2.0 psycopg2-binary==2.9.9"
]

[start]
cmd = "PATH=/opt/venv/bin:$PATH uvicorn main:app --host 0.0.0.0 --port $PORT"
